<svg xmlns="http://www.w3.org/2000/svg" width="680" height="408" viewBox="0 0 680 408" role="img"><title>wllama next to Tilde: where it breaks</title><desc>Both have an LFM3 recipe; wllama breaks lower in the stack, in its Safari fallback build and while loading.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.col{font-size:15px;font-weight:600;fill:#888780}.h{font-size:14px;font-weight:600}.s{font-size:12px}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal .h{fill:#085041}.teal .s{fill:#0F6E56}
.red rect{fill:#FCEBEB;stroke:#A32D2D}.red .h{fill:#791F1F}.red .s{fill:#A32D2D}
.gray rect{fill:#F1EFE8;stroke:#888780}.gray .h{fill:#444441}.gray .s{fill:#5F5E5A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}.key{font-size:12px;fill:#888780}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text class="col" x="180.0" y="36" text-anchor="middle" dominant-baseline="central">wllama (llama.cpp)</text><g class="teal"><rect x="40" y="62" width="280" height="56" rx="8" stroke-width="0.75"/><text class="h" x="180.0" y="81" text-anchor="middle" dominant-baseline="central">LFM3 recipe</text><text class="s" x="180.0" y="101" text-anchor="middle" dominant-baseline="central">Already in llama.cpp</text></g><g class="gray"><rect x="40" y="142" width="280" height="56" rx="8" stroke-width="0.75"/><text class="h" x="180.0" y="161" text-anchor="middle" dominant-baseline="central">WebGPU backend</text><text class="s" x="180.0" y="181" text-anchor="middle" dominant-baseline="central">C++, no watchdog pacing</text></g><line class="arr" x1="180.0" y1="119" x2="180.0" y2="139" marker-end="url(#a)"/><g class="red"><rect x="40" y="222" width="280" height="56" rx="8" stroke-width="0.75"/><text class="h" x="180.0" y="241" text-anchor="middle" dominant-baseline="central">Wasm build</text><text class="s" x="180.0" y="261" text-anchor="middle" dominant-baseline="central">Safari fallback, weights in heap</text></g><line class="arr" x1="180.0" y1="199" x2="180.0" y2="219" marker-end="url(#a)"/><g class="red"><rect x="40" y="302" width="280" height="56" rx="8" stroke-width="0.75"/><text class="h" x="180.0" y="321" text-anchor="middle" dominant-baseline="central">Loading</text><text class="s" x="180.0" y="341" text-anchor="middle" dominant-baseline="central">Tab killed by iOS</text></g><line class="arr" x1="180.0" y1="279" x2="180.0" y2="299" marker-end="url(#a)"/><text class="col" x="500.0" y="36" text-anchor="middle" dominant-baseline="central">Tilde</text><g class="teal"><rect x="360" y="62" width="280" height="56" rx="8" stroke-width="0.75"/><text class="h" x="500.0" y="81" text-anchor="middle" dominant-baseline="central">LFM3 recipe</text><text class="s" x="500.0" y="101" text-anchor="middle" dominant-baseline="central">lfm3.js</text></g><g class="teal"><rect x="360" y="142" width="280" height="56" rx="8" stroke-width="0.75"/><text class="h" x="500.0" y="161" text-anchor="middle" dominant-baseline="central">WebGPU kernels</text><text class="s" x="500.0" y="181" text-anchor="middle" dominant-baseline="central">Submits sized under 3 s</text></g><line class="arr" x1="500.0" y1="119" x2="500.0" y2="139" marker-end="url(#a)"/><g class="teal"><rect x="360" y="222" width="280" height="56" rx="8" stroke-width="0.75"/><text class="h" x="500.0" y="241" text-anchor="middle" dominant-baseline="central">Plain JavaScript</text><text class="s" x="500.0" y="261" text-anchor="middle" dominant-baseline="central">No Wasm heap at all</text></g><line class="arr" x1="500.0" y1="199" x2="500.0" y2="219" marker-end="url(#a)"/><g class="teal"><rect x="360" y="302" width="280" height="56" rx="8" stroke-width="0.75"/><text class="h" x="500.0" y="321" text-anchor="middle" dominant-baseline="central">Loading</text><text class="s" x="500.0" y="341" text-anchor="middle" dominant-baseline="central">Streams tensors to GPU</text></g><line class="arr" x1="500.0" y1="279" x2="500.0" y2="299" marker-end="url(#a)"/><text class="key" x="340.0" y="386" text-anchor="middle" dominant-baseline="central">green: works on the iPhone · red: where it breaks · grey: neutral or a trade-off</text></svg>
