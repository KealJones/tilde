<svg xmlns="http://www.w3.org/2000/svg" width="680" height="408" viewBox="0 0 680 408" role="img"><title>WebLLM next to Tilde: quick to load, until iOS 27 stops it</title><desc>WebLLM loads faster but queues big prompt pieces without waiting, which trips Safari 27.2.1 watchdog unless patched; Tilde reads official GGUFs and sizes its own submits.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.col{font-size:15px;font-weight:600;fill:#888780}.h{font-size:14px;font-weight:600}.s{font-size:12px}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal .h{fill:#085041}.teal .s{fill:#0F6E56}
.red rect{fill:#FCEBEB;stroke:#A32D2D}.red .h{fill:#791F1F}.red .s{fill:#A32D2D}
.gray rect{fill:#F1EFE8;stroke:#888780}.gray .h{fill:#444441}.gray .s{fill:#5F5E5A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}.key{font-size:12px;fill:#888780}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text class="col" x="180.0" y="36" text-anchor="middle" dominant-baseline="central">WebLLM (MLC)</text><g class="gray"><rect x="40" y="62" width="280" height="56" rx="8" stroke-width="0.75"/><text class="h" x="180.0" y="81" text-anchor="middle" dominant-baseline="central">Model build</text><text class="s" x="180.0" y="101" text-anchor="middle" dominant-baseline="central">Compiled ahead: 8 jobs</text></g><g class="teal"><rect x="40" y="142" width="280" height="56" rx="8" stroke-width="0.75"/><text class="h" x="180.0" y="161" text-anchor="middle" dominant-baseline="central">Speed</text><text class="s" x="180.0" y="181" text-anchor="middle" dominant-baseline="central">Loads ~1.5 s faster</text></g><line class="arr" x1="180.0" y1="119" x2="180.0" y2="139" marker-end="url(#a)"/><g class="red"><rect x="40" y="222" width="280" height="56" rx="8" stroke-width="0.75"/><text class="h" x="180.0" y="241" text-anchor="middle" dominant-baseline="central">Prompt reading</text><text class="s" x="180.0" y="261" text-anchor="middle" dominant-baseline="central">Big pieces, no waiting</text></g><line class="arr" x1="180.0" y1="199" x2="180.0" y2="219" marker-end="url(#a)"/><g class="gray"><rect x="40" y="302" width="280" height="56" rx="8" stroke-width="0.75"/><text class="h" x="180.0" y="321" text-anchor="middle" dominant-baseline="central">On iOS 27.2</text><text class="s" x="180.0" y="341" text-anchor="middle" dominant-baseline="central">Survives only with patches</text></g><line class="arr" x1="180.0" y1="279" x2="180.0" y2="299" marker-end="url(#a)"/><text class="col" x="500.0" y="36" text-anchor="middle" dominant-baseline="central">Tilde</text><g class="teal"><rect x="360" y="62" width="280" height="56" rx="8" stroke-width="0.75"/><text class="h" x="500.0" y="81" text-anchor="middle" dominant-baseline="central">Model build</text><text class="s" x="500.0" y="101" text-anchor="middle" dominant-baseline="central">Reads the official GGUF</text></g><g class="teal"><rect x="360" y="142" width="280" height="56" rx="8" stroke-width="0.75"/><text class="h" x="500.0" y="161" text-anchor="middle" dominant-baseline="central">Speed</text><text class="s" x="500.0" y="181" text-anchor="middle" dominant-baseline="central">Reads prompts 1.6–1.75× faster</text></g><line class="arr" x1="500.0" y1="119" x2="500.0" y2="139" marker-end="url(#a)"/><g class="teal"><rect x="360" y="222" width="280" height="56" rx="8" stroke-width="0.75"/><text class="h" x="500.0" y="241" text-anchor="middle" dominant-baseline="central">Prompt reading</text><text class="s" x="500.0" y="261" text-anchor="middle" dominant-baseline="central">Pieces sized by timing</text></g><line class="arr" x1="500.0" y1="199" x2="500.0" y2="219" marker-end="url(#a)"/><g class="teal"><rect x="360" y="302" width="280" height="56" rx="8" stroke-width="0.75"/><text class="h" x="500.0" y="321" text-anchor="middle" dominant-baseline="central">On iOS 27.2</text><text class="s" x="500.0" y="341" text-anchor="middle" dominant-baseline="central">Survives as is</text></g><line class="arr" x1="500.0" y1="279" x2="500.0" y2="299" marker-end="url(#a)"/><text class="key" x="340.0" y="386" text-anchor="middle" dominant-baseline="central">green: works on the iPhone · red: where it breaks · grey: neutral or a trade-off</text></svg>
