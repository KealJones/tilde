<!doctype html>
<meta charset="utf-8">
<title>Tilde kernel checks</title>
<pre id="log"></pre>
<script type="module">
// Fast correctness checks for individual kernels against CPU math on random data (no model needed).
import { openGpu } from '../src/gpu.js';
import { repackQ4_0, dequantQ4_0, f32ToF16, f16ToF32 } from '../src/quant.js';
import * as K from '../src/kernels.js';
const log = (...a) => { const s = a.join(' '); document.getElementById('log').textContent += s + '\n'; console.log(s); };
const rnd = (n, s = 1) => Float32Array.from({ length: n }, () => (Math.random() * 2 - 1) * s);

function randomQ4_0(rows, K) {
  const blocks = rows * K / 32, b = new Uint8Array(blocks * 18);
  for (let i = 0; i < blocks; i++) {
    const h = f32ToF16(0.01 + Math.random() * 0.05); b[i * 18] = h & 255; b[i * 18 + 1] = h >> 8;
    for (let j = 0; j < 16; j++) b[i * 18 + 2 + j] = (Math.random() * 256) | 0;
  }
  return b;
}

async function gemmCase(gpu, rows, Kd, T, name = 'gemmQ4_0', tile = 32) {
  const raw = randomQ4_0(rows, Kd);
  const { qs, d, blocks } = repackQ4_0(raw);
  const W = gpu.buffer(blocks * 16 + Math.ceil(blocks / 2) * 4);
  gpu.device.queue.writeBuffer(W, 0, qs); gpu.device.queue.writeBuffer(W, blocks * 16, d);
  const x = rnd(T * Kd), X = gpu.buffer(x.length * 4); gpu.device.queue.writeBuffer(X, 0, x);
  const Y = gpu.buffer(T * rows * 4);
  const u = gpu.uniform(new Uint32Array([rows, Kd, T, blocks * 4, rows, 0, Kd, 0]));
  await gpu.run((enc) => gpu.dispatch(enc, K[name], [u, W, X, Y], [Math.ceil(rows / 64), Math.ceil(T / tile)]));
  const y = new Float32Array(await gpu.read(Y, T * rows * 4));
  const w = dequantQ4_0(raw);
  let maxd = 0, maxv = 0;
  for (let t = 0; t < T; t++) for (let r = 0; r < rows; r++) {
    let s = 0; for (let k = 0; k < Kd; k++) s += w[r * Kd + k] * x[t * Kd + k];
    maxd = Math.max(maxd, Math.abs(s - y[t * rows + r])); maxv = Math.max(maxv, Math.abs(s));
  }
  for (const b of [W, X, Y]) gpu.free(b);
  const ok = maxd <= 1e-4 * Math.max(1, maxv);
  log(`${name} rows ${rows} K ${Kd} T ${T}: max |diff| ${maxd.toExponential(2)} (max |y| ${maxv.toFixed(2)})`, ok ? 'ok' : 'FAIL');
  return ok;
}

async function matvecCase(gpu, rows, Kd) {
  const raw = randomQ4_0(rows, Kd);
  const { qs, d, blocks } = repackQ4_0(raw);
  const W = gpu.buffer(blocks * 16 + Math.ceil(blocks / 2) * 4);
  gpu.device.queue.writeBuffer(W, 0, qs); gpu.device.queue.writeBuffer(W, blocks * 16, d);
  const x = rnd(Kd), X = gpu.buffer(Kd * 4); gpu.device.queue.writeBuffer(X, 0, x);
  const Y = gpu.buffer(rows * 4);
  const g = Math.ceil(rows / 8);
  await gpu.run((enc) => gpu.dispatch(enc, K.matvecQ4_0, [new Uint32Array([rows, Kd, 1, blocks * 4, rows, 0, Kd, 0]), W, X, Y], [Math.min(g, 4096), Math.ceil(g / 4096)]));
  const y = new Float32Array(await gpu.read(Y, rows * 4));
  const w = dequantQ4_0(raw);
  let maxd = 0;
  for (let r = 0; r < rows; r++) { let s = 0; for (let k = 0; k < Kd; k++) s += w[r * Kd + k] * x[k]; maxd = Math.max(maxd, Math.abs(s - y[r])); }
  for (const b of [W, X, Y]) gpu.free(b);
  const ok = maxd < 1e-4;
  log(`matvecQ4_0 rows ${rows} K ${Kd}: max |diff| ${maxd.toExponential(2)}`, ok ? 'ok' : 'FAIL');
  return ok;
}

async function embedQ4Case(gpu, rows, Kd, T) {
  const raw = randomQ4_0(rows, Kd);
  const { qs, d, blocks } = repackQ4_0(raw);
  const W = gpu.buffer(blocks * 16 + Math.ceil(blocks / 2) * 4);
  gpu.device.queue.writeBuffer(W, 0, qs); gpu.device.queue.writeBuffer(W, blocks * 16, d);
  const tok = Uint32Array.from({ length: T }, () => (Math.random() * rows) | 0);
  const I = gpu.buffer(T * 4); gpu.device.queue.writeBuffer(I, 0, tok);
  const Y = gpu.buffer(T * Kd * 4);
  await gpu.run((enc) => gpu.dispatch(enc, K.embedQ4_0, [new Uint32Array([Kd, blocks * 4, 0, 0]), W, I, Y], T));
  const y = new Float32Array(await gpu.read(Y, T * Kd * 4));
  const w = dequantQ4_0(raw);
  let maxd = 0;
  for (let t = 0; t < T; t++) for (let k = 0; k < Kd; k++) maxd = Math.max(maxd, Math.abs(w[tok[t] * Kd + k] - y[t * Kd + k]));
  for (const b of [W, I, Y]) gpu.free(b);
  const ok = maxd === 0;
  log(`embedQ4_0 rows ${rows} K ${Kd} T ${T}: max |diff| ${maxd}`, ok ? 'ok' : 'FAIL');
  return ok;
}

async function topkCase(gpu, n) {
  const l = rnd(n, 10);
  const L = gpu.buffer(n * 4); gpu.device.queue.writeBuffer(L, 0, l);
  const nw = Math.ceil(n / 256), C = gpu.buffer(nw * 16 * 8);
  await gpu.run((enc) => gpu.dispatch(enc, K.topk16, [new Uint32Array([n, 0, 0, 0]), L, C], nw));
  const u = new Uint32Array(await gpu.read(C, nw * 16 * 8));
  let ok = true;
  for (let w = 0; w < nw; w++) {
    const slice = [...l.subarray(w * 256, Math.min(n, w * 256 + 256))].map((v, i) => [v, w * 256 + i]).sort((a, b) => b[0] - a[0]).slice(0, 16);
    slice.forEach(([v, id], r) => { if (u[(w * 16 + r) * 2 + 1] !== id) ok = false; });
  }
  gpu.free(L); gpu.free(C);
  log(`topk16 n ${n}:`, ok ? 'ok' : 'FAIL');
  return ok;
}

// Fused attention vs CPU math: H query heads over KVH KV heads, T new tokens at pos0, L slots (a ring when slots < pos0 + T).
async function flashCase(gpu, H, KVH, gated, T, pos0, slots, window = 0xffffffff) {
  const L = Math.min(pos0 + T, slots), G = H / KVH;
  const q = rnd(T * H * 128, 2), g = rnd(T * H, 3);
  const halves = (n) => { const h = new Uint16Array(n); for (let i = 0; i < n; i++) h[i] = f32ToF16((Math.random() * 2 - 1) * 2); return h; };
  const kh = halves(slots * KVH * 128), vh = halves(slots * KVH * 128);
  const up = (a) => { const b = gpu.buffer(a.byteLength); gpu.device.queue.writeBuffer(b, 0, a); return b; };
  const Qb = up(q), Kb = up(new Uint32Array(kh.buffer)), Vb = up(new Uint32Array(vh.buffer)), Gb = up(g), Ob = gpu.buffer(T * H * 128 * 4);
  const u = new Uint32Array([pos0, T, slots, L, window, 0, 0, 0]);
  const code = K.attnFlashFor(H, KVH, gated);
  await gpu.run((enc) => gpu.dispatch(enc, code, gated ? [u, Qb, Kb, Vb, Gb, Ob] : [u, Qb, Kb, Vb, Ob], [Math.ceil(T / (16 / G)), KVH]));
  const o = new Float32Array(await gpu.read(Ob, T * H * 128 * 4));
  const maxPos = pos0 + T - 1;
  let maxd = 0;
  for (let t = 0; t < T; t++) for (let h = 0; h < H; h++) {
    const qp = pos0 + t, kv = Math.floor(h / G), s = new Float64Array(L).fill(-Infinity);
    for (let j = 0; j < L; j++) {
      const kp = maxPos - ((maxPos + slots - (j % slots)) % slots);
      if (kp < 0 || kp > qp || qp - kp >= window) continue;
      let a = 0; for (let d = 0; d < 128; d++) a += q[(t * H + h) * 128 + d] * f16ToF32(kh[(j * KVH + kv) * 128 + d]);
      s[j] = a / Math.sqrt(128);
    }
    const mx = Math.max(...s); let sum = 0; for (let j = 0; j < L; j++) { s[j] = Math.exp(s[j] - mx); sum += s[j]; }
    const gate = gated ? 1 / (1 + Math.exp(-g[t * H + h])) : 1;
    for (let d = 0; d < 128; d++) {
      let a = 0; for (let j = 0; j < L; j++) if (s[j]) a += s[j] * f16ToF32(vh[(j * KVH + kv) * 128 + d]);
      maxd = Math.max(maxd, Math.abs(a / sum * gate - o[(t * H + h) * 128 + d]));
    }
  }
  for (const b of [Qb, Kb, Vb, Gb, Ob]) gpu.free(b);
  const ok = maxd < 1e-4;
  log(`attnFlash H ${H} KVH ${KVH}${gated ? ' gated' : ''} T ${T} pos0 ${pos0} slots ${slots}${window < 1e9 ? ' window ' + window : ''}: max |diff| ${maxd.toExponential(2)}`, ok ? 'ok' : 'FAIL');
  return ok;
}

try {
  const gpu = await openGpu();
  // A shader the browser refuses (compile, validation, limits) otherwise only shows up as zeros in the results.
  gpu.device.addEventListener('uncapturederror', (e) => log('GPU error:', e.error && e.error.message));
  log('limits: workgroup storage', gpu.device.limits.maxComputeWorkgroupStorageSize, 'invocations', gpu.device.limits.maxComputeInvocationsPerWorkgroup, '·', navigator.userAgent);
  let ok = true;
  const only = new URLSearchParams(location.search).get('only'); // ?only=matvec|flash
  if (only !== 'flash') for (const [r, k] of [[8, 32], [13, 2048], [300, 7680], [33000, 64]]) ok = (await matvecCase(gpu, r, k)) && ok;
  if (!only) {
  for (const n of [256, 1000, 128000]) ok = (await topkCase(gpu, n)) && ok;
  for (const [r, k, t] of [[10, 64, 3], [1000, 1024, 17], [151936, 1024, 2]]) ok = (await embedQ4Case(gpu, r, k, t)) && ok;
  for (const [r, k, t] of [[64, 64, 32], [100, 96, 5], [200, 256, 33], [130, 128, 64], [7, 32, 70]]) ok = (await gemmCase(gpu, r, k, t)) && ok;
  for (const [r, k, t] of [[64, 64, 64], [100, 96, 5], [200, 256, 33], [130, 128, 64], [7, 32, 70], [1024, 1024, 130]]) ok = (await gemmCase(gpu, r, k, t, 'gemmQ4_0x64', 64)) && ok;
  }
  if (!only || only === 'flash') for (const a of [[16, 8, false, 64, 192, 1024], [16, 8, false, 5, 0, 1024], [16, 8, false, 33, 10, 64], [16, 4, true, 37, 500, 1024],
    [16, 4, true, 20, 150, 80, 48], [16, 4, true, 64, 0, 576, 512], [16, 4, true, 1, 700, 576, 512]]) ok = (await flashCase(gpu, ...a)) && ok;
  window.__result = { ok };
} catch (e) { log('ERROR', e.stack || e); window.__result = { ok: false }; }
</script>
