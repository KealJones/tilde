<svg xmlns="http://www.w3.org/2000/svg" width="680" height="298" viewBox="0 0 680 298" role="img"><title>What a model file holds, and what the engine has to know</title><desc>A GGUF holds weights, settings and the tokenizer; the wiring that says how to run them lives in the engine, one adapter per architecture.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.col{font-size:15px;font-weight:600;fill:#888780}.h{font-size:14px;font-weight:600}.s{font-size:12px}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal .h{fill:#085041}.teal .s{fill:#0F6E56}
.red rect{fill:#FCEBEB;stroke:#A32D2D}.red .h{fill:#791F1F}.red .s{fill:#A32D2D}
.gray rect{fill:#F1EFE8;stroke:#888780}.gray .h{fill:#444441}.gray .s{fill:#5F5E5A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}.key{font-size:12px;fill:#888780}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text class="col" x="180.0" y="36" text-anchor="middle" dominant-baseline="central">In the GGUF file</text><g class="gray"><rect x="40" y="62" width="280" height="56" rx="8" stroke-width="0.75"/><text class="h" x="180.0" y="81" text-anchor="middle" dominant-baseline="central">Weights</text><text class="s" x="180.0" y="101" text-anchor="middle" dominant-baseline="central">Named tensors, 4-bit</text></g><g class="gray"><rect x="40" y="142" width="280" height="56" rx="8" stroke-width="0.75"/><text class="h" x="180.0" y="161" text-anchor="middle" dominant-baseline="central">Settings</text><text class="s" x="180.0" y="181" text-anchor="middle" dominant-baseline="central">Sizes, vocab, context</text></g><line class="arr" x1="180.0" y1="119" x2="180.0" y2="139" marker-end="url(#a)"/><g class="gray"><rect x="40" y="222" width="280" height="56" rx="8" stroke-width="0.75"/><text class="h" x="180.0" y="241" text-anchor="middle" dominant-baseline="central">Tokenizer</text><text class="s" x="180.0" y="261" text-anchor="middle" dominant-baseline="central">Vocabulary and merges</text></g><line class="arr" x1="180.0" y1="199" x2="180.0" y2="219" marker-end="url(#a)"/><text class="col" x="500.0" y="36" text-anchor="middle" dominant-baseline="central">In the engine (lfm3.js)</text><g class="teal"><rect x="360" y="62" width="280" height="56" rx="8" stroke-width="0.75"/><text class="h" x="500.0" y="81" text-anchor="middle" dominant-baseline="central">Layer order</text><text class="s" x="500.0" y="101" text-anchor="middle" dominant-baseline="central">13 conv, 5 windowed, 6 full</text></g><g class="teal"><rect x="360" y="142" width="280" height="56" rx="8" stroke-width="0.75"/><text class="h" x="500.0" y="161" text-anchor="middle" dominant-baseline="central">Wiring</text><text class="s" x="500.0" y="181" text-anchor="middle" dominant-baseline="central">Norms, gates, residuals</text></g><line class="arr" x1="500.0" y1="119" x2="500.0" y2="139" marker-end="url(#a)"/><g class="teal"><rect x="360" y="222" width="280" height="56" rx="8" stroke-width="0.75"/><text class="h" x="500.0" y="241" text-anchor="middle" dominant-baseline="central">GPU kernels</text><text class="s" x="500.0" y="261" text-anchor="middle" dominant-baseline="central">One per kind of layer</text></g><line class="arr" x1="500.0" y1="199" x2="500.0" y2="219" marker-end="url(#a)"/></svg>
