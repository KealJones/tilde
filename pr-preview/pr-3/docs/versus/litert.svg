<svg xmlns="http://www.w3.org/2000/svg" width="680" height="328" viewBox="0 0 680 328" role="img"><title>LiteRT-LM next to Tilde: memory while loading</title><desc>LiteRT-LM passed 1,593 MB of GPU buffers while loading and the tab was killed; Tilde holds 1,124 MB for the whole run.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.col{font-size:15px;font-weight:600;fill:#888780}.h{font-size:14px;font-weight:600}.s{font-size:12px}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal .h{fill:#085041}.teal .s{fill:#0F6E56}
.red rect{fill:#FCEBEB;stroke:#A32D2D}.red .h{fill:#791F1F}.red .s{fill:#A32D2D}
.gray rect{fill:#F1EFE8;stroke:#888780}.gray .h{fill:#444441}.gray .s{fill:#5F5E5A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}.key{font-size:12px;fill:#888780}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text class="col" x="180.0" y="36" text-anchor="middle" dominant-baseline="central">LiteRT-LM (Google)</text><g class="gray"><rect x="40" y="62" width="280" height="56" rx="8" stroke-width="0.75"/><text class="h" x="180.0" y="81" text-anchor="middle" dominant-baseline="central">Model file</text><text class="s" x="180.0" y="101" text-anchor="middle" dominant-baseline="central">.litertlm bundle, 1.44 GB</text></g><g class="red"><rect x="40" y="142" width="280" height="56" rx="8" stroke-width="0.75"/><text class="h" x="180.0" y="161" text-anchor="middle" dominant-baseline="central">Loading</text><text class="s" x="180.0" y="181" text-anchor="middle" dominant-baseline="central">1,593 MB of GPU buffers</text></g><line class="arr" x1="180.0" y1="119" x2="180.0" y2="139" marker-end="url(#a)"/><g class="red"><rect x="40" y="222" width="280" height="56" rx="8" stroke-width="0.75"/><text class="h" x="180.0" y="241" text-anchor="middle" dominant-baseline="central">On the iPhone</text><text class="s" x="180.0" y="261" text-anchor="middle" dominant-baseline="central">Tab killed while loading</text></g><line class="arr" x1="180.0" y1="199" x2="180.0" y2="219" marker-end="url(#a)"/><text class="col" x="500.0" y="36" text-anchor="middle" dominant-baseline="central">Tilde</text><g class="gray"><rect x="360" y="62" width="280" height="56" rx="8" stroke-width="0.75"/><text class="h" x="500.0" y="81" text-anchor="middle" dominant-baseline="central">Model file</text><text class="s" x="500.0" y="101" text-anchor="middle" dominant-baseline="central">Official GGUF, 1.05 GB</text></g><g class="teal"><rect x="360" y="142" width="280" height="56" rx="8" stroke-width="0.75"/><text class="h" x="500.0" y="161" text-anchor="middle" dominant-baseline="central">Loading</text><text class="s" x="500.0" y="181" text-anchor="middle" dominant-baseline="central">Every byte counted</text></g><line class="arr" x1="500.0" y1="119" x2="500.0" y2="139" marker-end="url(#a)"/><g class="teal"><rect x="360" y="222" width="280" height="56" rx="8" stroke-width="0.75"/><text class="h" x="500.0" y="241" text-anchor="middle" dominant-baseline="central">On the iPhone</text><text class="s" x="500.0" y="261" text-anchor="middle" dominant-baseline="central">1,124 MB, whole run</text></g><line class="arr" x1="500.0" y1="199" x2="500.0" y2="219" marker-end="url(#a)"/><text class="key" x="340.0" y="306" text-anchor="middle" dominant-baseline="central">green: works on the iPhone · red: where it breaks · grey: neutral or a trade-off</text></svg>
